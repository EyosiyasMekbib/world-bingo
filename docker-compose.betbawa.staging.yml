# ============================================================
# Staging Compose — betbawa (Dokploy)
# ============================================================
# Mirror of docker-compose.betbawa.yml, isolated for STAGING.
# External DB + Redis. Set DATABASE_URL / REDIS_URL in Dokploy.
#
# Isolation notes (why this differs from the prod brand file):
#   - Service names suffixed `-betbawa-stg` so their network aliases
#     do NOT collide with the betbawa PROD stack (api-betbawa/...)
#     or any other deployment on dokploy-network.
#   - Inter-service traffic runs on a PRIVATE `internal` network;
#     dokploy-network is only attached where the proxy needs reach.
#   - Image tags suffixed `:betbawa-stg` so staging builds never
#     clobber the prod images.
#   - Monitoring (Prometheus/Grafana) intentionally omitted to keep
#     staging lean.

services:
  api-betbawa-stg:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: world-bingo-api:betbawa-stg
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      ALLOW_SCHEMA_DRIFT: ${ALLOW_SCHEMA_DRIFT:-false}
      # --- ZareCash (deposits & withdrawals as a service) ---
      # No-op while ZARECASH_ENABLED=false. Compose forwards only what a service
      # declares, so every one of these must be listed here or it never reaches
      # the process, however it is set in the deployment platform.
      ZARECASH_ENABLED: ${ZARECASH_ENABLED:-false}
      ZARECASH_BASE_URL: ${ZARECASH_BASE_URL:-https://api.zarecash.com}
      ZARECASH_API_KEY: ${ZARECASH_API_KEY:-}
      ZARECASH_WEBHOOK_SECRET: ${ZARECASH_WEBHOOK_SECRET:-}
      ZARECASH_MODE: ${ZARECASH_MODE:-test}
      ZARECASH_TIMEOUT_MS: ${ZARECASH_TIMEOUT_MS:-10000}
      ZARECASH_WITHDRAWAL_ATTEMPTS: ${ZARECASH_WITHDRAWAL_ATTEMPTS:-8}
      DB_MAX_RETRIES: ${DB_MAX_RETRIES:-30}
      DB_RETRY_DELAY_SECS: ${DB_RETRY_DELAY_SECS:-2}
      RUN_SEED: ${RUN_SEED:-false}
      SEED_STRICT: ${SEED_STRICT:-false}
      MIGRATION_ROLLBACK_ID: ${MIGRATION_ROLLBACK_ID:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:-}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: 8080
      HOST: 0.0.0.0
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GASEA_API_BASE_URL: ${GASEA_API_BASE_URL:-}
      GASEA_API_KEY: ${GASEA_API_KEY:-}
      GASEA_API_SECRET: ${GASEA_API_SECRET:-}
      GASEA_SIGNATURE_DEBUG: ${GASEA_SIGNATURE_DEBUG:-false}
      GASEA_DEFAULT_CURRENCY: ${GASEA_DEFAULT_CURRENCY:-ETB}
      PALACE_API_BASE_URL: ${PALACE_API_BASE_URL:-https://agent.goldslotpalase.com}
      PALACE_API_TOKEN: ${PALACE_API_TOKEN:-}
      PALACE_CALLBACK_TOKEN: ${PALACE_CALLBACK_TOKEN:-}
      PALACE_CURRENCY: ${PALACE_CURRENCY:-ETB}
      PALACE_SPOKE_TIMEOUT_MS: ${PALACE_SPOKE_TIMEOUT_MS:-5000}
      DEPLOYMENT_ROLE: ${DEPLOYMENT_ROLE:-standalone}
      DEPLOYMENT_CODE: ${DEPLOYMENT_CODE:-}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
      POSTHOG_BRAND: ${POSTHOG_BRAND:-betbawa}
      HUB_DEPLOYMENTS: ${HUB_DEPLOYMENTS:-}
      HUB_URL: ${HUB_URL:-}
      HUB_SHARED_SECRET: ${HUB_SHARED_SECRET:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-https://staging.betbawa.bet}
      RATE_LIMIT_WHITELIST: ${RATE_LIMIT_WHITELIST:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    volumes:
      - uploads_data:/app/apps/api/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - internal
      - dokploy-network

  web-betbawa-stg:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser /api, /socket.io, /v1, /uploads must proxy to THIS stack's api,
        # not the bare `api` alias (which resolves to another stack on dokploy-network).
        NUXT_API_PROXY_TARGET: http://api-betbawa-stg:8080
        # PostHog source maps for error tracking (apps/web/scripts/posthog-sourcemaps.sh).
        # The key arrives as the build secret below, never as an arg. Empty project
        # id → upload skipped; .map files are stripped from the image either way.
        POSTHOG_CLI_PROJECT_ID: ${POSTHOG_CLI_PROJECT_ID:-}
        POSTHOG_CLI_HOST: ${POSTHOG_CLI_HOST:-https://eu.posthog.com}
      secrets:
        - POSTHOG_CLI_API_KEY
    image: world-bingo-web:betbawa-stg
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api}
      NUXT_PUBLIC_POSTHOG_KEY: ${NUXT_PUBLIC_POSTHOG_KEY:-}
      NUXT_PUBLIC_POSTHOG_HOST: ${NUXT_PUBLIC_POSTHOG_HOST:-/ingest}
      NUXT_PUBLIC_POSTHOG_UI_HOST: ${NUXT_PUBLIC_POSTHOG_UI_HOST:-https://eu.posthog.com}
      NUXT_PUBLIC_POSTHOG_REPLAY: ${NUXT_PUBLIC_POSTHOG_REPLAY:-true}
      NUXT_PUBLIC_POSTHOG_BRAND: ${NUXT_PUBLIC_POSTHOG_BRAND:-betbawa}
      NUXT_PUBLIC_WS_URL: /
      NUXT_API_BASE_SERVER: ${NUXT_API_BASE_SERVER:-http://api-betbawa-stg:8080}
      NUXT_PUBLIC_TELEGRAM_BOT_NAME: ${NUXT_PUBLIC_TELEGRAM_BOT_NAME:-}
      NUXT_PUBLIC_TELEGRAM_BOT_ID: ${NUXT_PUBLIC_TELEGRAM_BOT_ID:-}
    depends_on:
      api-betbawa-stg:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network

  admin-betbawa-stg:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NUXT_API_PROXY_TARGET: http://api-betbawa-stg:8080
    image: world-bingo-admin:betbawa-stg
    restart: unless-stopped
    ports:
      - "3001"
    environment:
      NUXT_PUBLIC_API_BASE: /api
      # Same-origin: the admin's own /socket.io/** routeRule proxies to the API.
      NUXT_PUBLIC_WS_URL: /
      NUXT_API_BASE_SERVER: ${NUXT_API_BASE_SERVER:-http://api-betbawa-stg:8080}
      NUXT_JWT_SECRET: ${NUXT_JWT_SECRET:-}
    depends_on:
      api-betbawa-stg:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network

volumes:
  uploads_data:

networks:
  internal:
  dokploy-network:
    external: true

secrets:
  # Build-time only. Compose reads it from this stack's .env (Dokploy writes
  # that file) and BuildKit mounts it at /run/secrets/POSTHOG_CLI_API_KEY for
  # the web image build. Unset → empty file → upload skipped. Never a layer.
  POSTHOG_CLI_API_KEY:
    environment: POSTHOG_CLI_API_KEY
